<script>
(function () {
  var nav;
  function update(game, page) {
    if (!nav) return;
    var mainPage = /^(news|games|about|support|link[012])\.htm$/.test(page || '');
    nav.style.display = game || mainPage ? 'block' : 'none';
    if (!game && !mainPage) return;
    var home = document.getElementById('game-home');
    var middle = document.getElementById('game-middle');
    var other = document.getElementById('game-other');
    if (!game) {
      home.href = 'news.htm'; home.target = 'detail';

    home.href = multi ? 'dispel_multi/news.htm' : 'dispel/news.htm'; home.target = 'contents';
    middle.href = 'news.htm'; middle.textContent = 'ABALON STUDIO';
    other.href = multi ? 'dispel/dispel.htm' : 'dispel_multi/dispel_multi.htm';
    other.textContent = multi ? 'DISPEL' : 'COLOSSEUM';
  }
  window.addEventListener('message', function (event) {
    if (event.source === parent && event.data && event.data.type === 'abalonet-header-state') update(event.data.game, event.data.page);
  });

    nav = document.createElement('nav');

    document.body.appendChild(nav);
    parent.postMessage({type:'abalonet-header-ready'}, '*');
  });
}());
