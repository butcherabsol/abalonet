<script>
(function () {
  var link = document.getElementById('language-switch');
  var gameState = null;
  var languageHome = link.getAttribute('href');
  window.addEventListener('message', function (event) {
    if (event.source === parent && event.data && event.data.type === 'abalonet-language-state') { gameState = event.data.game; if (!gameState) link.href = languageHome; }
  });
  parent.postMessage({type:'abalonet-language-ready'}, '*');
  link.onclick = function () {
    if (gameState && gameState.page) {
      link.href = link.getAttribute('href').split('?')[0] + '?page=' + encodeURIComponent(gameState.page) + (gameState.sub ? '&sub=' + encodeURIComponent(gameState.sub) : '');
      return;
    }
    try {
      var detail = parent.frames['detail'].location;
      var page = detail.pathname.split('/').pop();
      if (/^(news|games|about|support|link[012])\.htm$/.test(page)) {
        link.href = 'eng/main.htm?page=' + encodeURIComponent(page) + detail.hash;
      }
    } catch (e) { /* Use the destination home page if the frame is inaccessible. */ }
  };
}());
</script>

<script>
(function () {
  var animations = ['1_spiral_path_hover.gif', '2_star_path_hover.gif', '3_orb_path_hover.gif', '4_coil_hover.gif', '5_ribbon_path_hover.gif'];
  animations.forEach(function (name, index) {
    var image = document.querySelector('img[name="bt' + (index + 1) + '"]');
    if (!image || !image.parentElement) return;
    var link = image.parentElement;
    var still = image.getAttribute('src');
    var animation = 'f_left_files/' + name;
    var preload = new Image();
    preload.src = animation;
    var restartCount = 0;
    var animationTimer = null;
    function showAnimation() {
      restartCount += 1;
      clearTimeout(animationTimer);
      image.src = animation + '?restart=' + restartCount;
      animationTimer = setTimeout(function () {
        animationTimer = null;
        showStill();
      }, 2750);
    }
    function showStill() {
      if (animationTimer === null && !link.matches(':hover') && document.activeElement !== link) image.src = still;
    }
    link.addEventListener('mouseenter', showAnimation);
    link.addEventListener('mouseleave', showStill);
    link.addEventListener('focus', showAnimation);
    link.addEventListener('blur', showStill);
  });
}());
</script>
